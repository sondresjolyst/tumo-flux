name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/(?<version>v.+)$
      KUSTOMIZE_VERSION: v5.8.1
      # renovate: datasource=github-releases depName=fluxcd/flux2
      FLUX_VERSION: v2.10.0
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
      # Server version of the production cluster, for the built-in schemas.
      KUBERNETES_VERSION: 1.36.1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize and flux
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" kustomize
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" flux
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Build every kustomization
        run: |
          status=0
          while read -r kustomization; do
            dir=$(dirname "${kustomization}")
            echo "==> ${dir}"
            # The layer Kustomizations patch with overlay files outside their
            # own directory, which Flux allows inside the repository.
            kustomize build --load-restrictor LoadRestrictionsNone "${dir}" > /dev/null || status=1
          done < <(find clusters components -name kustomization.yaml | sort)
          exit "${status}"

      - name: Build the Flux Kustomizations
        env:
          # Values of the in-cluster tumo-flux-config ConfigMap.
          CLUSTER_NAME: kubernetes
          CLUSTER_TYPE: production
          DNS_ZONE: prod.tumogroup.com
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/rendered"
          ks="${RUNNER_TEMP}/ks"
          mkdir -p "${rendered}" "${ks}"

          printf 'apiVersion: kustomize.toolkit.fluxcd.io/v1\nkind: Kustomization\nmetadata:\n  name: flux-system\n  namespace: flux-system\nspec:\n  path: ./clusters/production\n' \
            > "${ks}/flux-system.yaml"
          flux build kustomization flux-system \
            --path ./clusters/production \
            --kustomization-file "${ks}/flux-system.yaml" \
            --dry-run > "${rendered}/flux-system.yaml"

          # Each layer is built from its own spec in layers.yaml, so its patches
          # apply. It substitutes from the cluster-versions and tumo-flux-config
          # ConfigMaps. A dry run cannot read them, so inline their data.
          while read -r name path; do
            NAME="${name}" yq eval-all '
              select(.kind == "Kustomization" and .metadata.name == strenv(NAME))
              | del(.spec.postBuild.substituteFrom)
              | .spec.postBuild.substitute = (load("clusters/production/versions.yaml").data + {
                  "clusterName": strenv(CLUSTER_NAME),
                  "clusterType": strenv(CLUSTER_TYPE),
                  "dnsZone": strenv(DNS_ZONE)
                })
            ' clusters/production/layers.yaml > "${ks}/${name}.yaml"
            test -s "${ks}/${name}.yaml" || {
              echo "::error::No Kustomization named ${name} in clusters/production/layers.yaml"
              exit 1
            }
            echo "==> ${name}"
            flux build kustomization "${name}" \
              --path "${path}" \
              --kustomization-file "${ks}/${name}.yaml" \
              --strict-substitute \
              --dry-run > "${rendered}/${name}.yaml"
          done <<'EOF'
          infrastructure-controllers ./clusters/production/infrastructure/controllers
          infrastructure-configs ./clusters/production/infrastructure/configs
          apps ./clusters/production/apps
          EOF

          # The cert-manager chart is applied by a child Kustomization with its own
          # substitutions. Build it from its rendered spec, with the data inlined.
          yq eval '
            select(.apiVersion == "kustomize.toolkit.fluxcd.io/v1" and .kind == "Kustomization" and .metadata.name == "cert-manager")
            | del(.spec.postBuild.substituteFrom)
            | .spec.postBuild.substitute = (load("clusters/production/versions.yaml").data + {
                "clusterName": strenv(CLUSTER_NAME),
                "clusterType": strenv(CLUSTER_TYPE),
                "dnsZone": strenv(DNS_ZONE)
              })
          ' "${rendered}/infrastructure-controllers.yaml" > "${ks}/cert-manager.yaml"
          test -s "${ks}/cert-manager.yaml" || {
            echo "::error::No cert-manager Kustomization in the infrastructure-controllers render"
            exit 1
          }
          echo "==> cert-manager"
          flux build kustomization cert-manager \
            --path "$(yq eval '.spec.path' "${ks}/cert-manager.yaml")" \
            --kustomization-file "${ks}/cert-manager.yaml" \
            --strict-substitute \
            --dry-run > "${rendered}/cert-manager.yaml"

      - name: Validate rendered manifests against schemas
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/kubeconform"
          mkdir -p "${dir}"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSL -o "${dir}/kubeconform-linux-amd64.tar.gz" "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o "${dir}/CHECKSUMS" "${base}/CHECKSUMS"
          (cd "${dir}" && grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check --strict)
          tar -xzf "${dir}/kubeconform-linux-amd64.tar.gz" -C "${RUNNER_TEMP}/bin" kubeconform
          # The flux-system render carries the Flux CRDs, which have no schema.
          # Any other kind without a schema fails the check.
          kubeconform \
            -strict \
            -summary \
            -skip CustomResourceDefinition \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${RUNNER_TEMP}"/rendered/*.yaml

      - name: Check every version is a string
        run: |
          # ConfigMap data only takes strings. Quoting is not an option because
          # the update script rewrites the raw value.
          if sed -n '/^data:/,$p' clusters/production/versions.yaml | tail -n +2 \
            | awk '{ print $1, ($2 ~ /^#/ ? "" : $2) }' \
            | grep -Ei ' ([-+]?([0-9_]+|[0-9_]*\.[0-9_]+|[0-9_]+\.[0-9_]*)([e][-+]?[0-9]+)?|0x[0-9a-f]+|true|false|yes|no|y|n|on|off|null|~)?$'; then
            echo "::error::versions.yaml has a value that YAML reads as a number, a boolean or null"
            exit 1
          fi

      - name: Check every chart version was patched
        run: |
          set -euo pipefail
          if grep -nE "(version|tag): xx" "${RUNNER_TEMP}"/rendered/*.yaml; then
            echo "::error::A chart source reached the cluster without a patched version"
            exit 1
          fi
          # Every OCIRepository must point at one chart version.
          bad=$(yq eval-all '
            select(.kind == "OCIRepository")
            | select((.spec.ref.tag // "") | test("^v?[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$") | not)
            | .metadata.name
          ' "${RUNNER_TEMP}"/rendered/*.yaml)
          if [ -n "${bad}" ]; then
            echo "::error::OCIRepository without a chart version tag: ${bad}"
            exit 1
          fi

      - name: Check every replacement was applied
        run: |
          # A replacement whose target no longer matches is skipped without an error.
          if grep -n "set-by-replacement" "${RUNNER_TEMP}"/rendered/*.yaml
          then
            echo "::error::A placeholder reached the cluster. Fix the replacements that should fill it."
            exit 1
          fi

      - name: Check every HelmRelease namespace has Discord alerts
        run: |
          rendered=$(awk '/^kind: HelmRelease$/{hr=1} /^---$/{hr=0} hr && /^  namespace: /{print $2}' "${RUNNER_TEMP}"/rendered/*.yaml | sort -u)
          listed=$(awk '/kind: HelmRelease/{hr=1; next} hr && /namespace: /{print $2; hr=0}' clusters/production/notifications.yaml | sort -u)
          missing=$(comm -23 <(echo "${rendered}") <(echo "${listed}"))
          if [ -n "${missing}" ]; then
            echo "::error::Add these HelmRelease namespaces to clusters/production/notifications.yaml: ${missing}"
            exit 1
          fi
