apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - versions.yaml
  - layers.yaml
patches:
  # flux-system keeps pruning off while objects move to the layer Kustomizations.
  - target:
      kind: Kustomization
      name: flux-system
    patch: |-
      - op: replace
        path: /spec/prune
        value: false
  - target:
      kind: Namespace
      name: flux-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
