apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: altinnendata-api
  namespace: altinnendata-prod
spec:
  values:
    ingress:
      hosts:
        - host: altinnendata-api.prod.tumogroup.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: altinnendata-api-tls
          hosts:
            - altinnendata-api.prod.tumogroup.com
