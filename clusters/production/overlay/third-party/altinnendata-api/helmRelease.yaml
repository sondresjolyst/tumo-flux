# Shared by dev and prod. What differs per namespace is in helmRelease-dev.yaml and helmRelease-prod.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: altinnendata-api
spec:
  chart:
    spec:
      chart: altinnendata-api
      version: ${ALTINNENDATA_API_VERSION} # Set in postBuild production
  values:
    env:
      # Chrome's own sandbox cannot start in this pod. The pod already runs unprivileged
      # with a read-only root filesystem, no capabilities and the default seccomp profile.
      - name: PUPPETEER_NO_SANDBOX
        value: "1"
      - name: CONNECTIONSTRINGS__DEFAULTCONNECTION
        secretKeyRef:
          key: CONNECTIONSTRINGS__DEFAULTCONNECTION
          name: altinnendata-api-secrets
      - name: JWT__KEY
        secretKeyRef:
          key: JWT__KEY
          name: altinnendata-api-secrets
      - name: JWT__ISSUER
        secretKeyRef:
          key: JWT__ISSUER
          name: altinnendata-api-secrets
      - name: BREVOSETTINGS__APIKEY
        secretKeyRef:
          key: BREVOSETTINGS__APIKEY
          name: altinnendata-api-secrets
      - name: BREVOSETTINGS__SENDEREMAIL
        secretKeyRef:
          key: BREVOSETTINGS__SENDEREMAIL
          name: altinnendata-api-secrets
      - name: BREVOSETTINGS__SENDERNAME
        secretKeyRef:
          key: BREVOSETTINGS__SENDERNAME
          name: altinnendata-api-secrets
      - name: SEED__ADMINEMAIL
        secretKeyRef:
          key: SEED__ADMINEMAIL
          name: altinnendata-api-secrets
      - name: SEED__ADMINPASSWORD
        secretKeyRef:
          key: SEED__ADMINPASSWORD
          name: altinnendata-api-secrets
      # Password and invite emails link back here, so it must match this environment.
      - name: SITE__BASEURL
        secretKeyRef:
          key: SITE__BASEURL
          name: altinnendata-api-secrets
      - name: VIPPS__CLIENTID
        secretKeyRef:
          key: VIPPS__CLIENTID
          name: altinnendata-api-secrets
      - name: VIPPS__CLIENTSECRET
        secretKeyRef:
          key: VIPPS__CLIENTSECRET
          name: altinnendata-api-secrets
      - name: VIPPS__SUBSCRIPTIONKEY
        secretKeyRef:
          key: VIPPS__SUBSCRIPTIONKEY
          name: altinnendata-api-secrets
      - name: VIPPS__MERCHANTSERIALNUMBER
        secretKeyRef:
          key: VIPPS__MERCHANTSERIALNUMBER
          name: altinnendata-api-secrets
      - name: VIPPS__TESTCLIENTID
        secretKeyRef:
          key: VIPPS__TESTCLIENTID
          name: altinnendata-api-secrets
      - name: VIPPS__TESTCLIENTSECRET
        secretKeyRef:
          key: VIPPS__TESTCLIENTSECRET
          name: altinnendata-api-secrets
      - name: VIPPS__TESTSUBSCRIPTIONKEY
        secretKeyRef:
          key: VIPPS__TESTSUBSCRIPTIONKEY
          name: altinnendata-api-secrets
      - name: VIPPS__TESTMERCHANTSERIALNUMBER
        secretKeyRef:
          key: VIPPS__TESTMERCHANTSERIALNUMBER
          name: altinnendata-api-secrets
      # The API registers its Vipps webhook at this address.
      - name: API__PUBLICBASEURL
        secretKeyRef:
          key: API__PUBLICBASEURL
          name: altinnendata-api-secrets
      # Encrypts the Data Protection keys stored in the database.
      - name: DATAPROTECTION__CERTIFICATE
        secretKeyRef:
          key: DATAPROTECTION__CERTIFICATE
          name: altinnendata-api-secrets
    podLabels:
      logformat: serilog
    image:
      pullPolicy: Always
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      tls:
        - secretName: altinnendata-api-tls
          hosts:
            # Copied from hosts[0].host in each namespace by replacements.yaml.
            - set-by-replacement
    resources:
      requests:
        memory: "1024Mi"
        cpu: "750m"
      limits:
        memory: "1024Mi"
        cpu: "750m"
