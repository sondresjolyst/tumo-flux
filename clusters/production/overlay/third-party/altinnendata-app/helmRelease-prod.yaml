apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: altinnendata-app
  namespace: altinnendata-prod
spec:
  values:
    ingress:
      hosts:
        - host: www.altinnendata.no
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: altinnendata-app-tls
          hosts:
            - www.altinnendata.no
