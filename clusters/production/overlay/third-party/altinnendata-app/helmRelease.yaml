apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: altinnendata-app
  namespace: altinnendata-dev
spec:
  chart:
    spec:
      chart: altinnendata-app
      version: ${ALTINNENDATA_APP_VERSION} # Set in postBuild production
  values:
    env:
      - name: NEXTAUTH_SECRET
        secretKeyRef:
          key: NEXTAUTH_SECRET
          name: altinnendata-app-secrets
      - name: NEXTAUTH_URL
        secretKeyRef:
          key: NEXTAUTH_URL
          name: altinnendata-app-secrets
      - name: ALTINNENDATA_API_JWT_SECRET
        secretKeyRef:
          key: ALTINNENDATA_API_JWT_SECRET
          name: altinnendata-app-secrets
    image:
      tag: "dev"
      pullPolicy: Always
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: dev.altinnendata.no
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: altinnendata-app-tls
          hosts:
            - dev.altinnendata.no
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "512Mi"
        cpu: "500m"
---
