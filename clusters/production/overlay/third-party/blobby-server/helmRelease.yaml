apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blobby-server
  namespace: julalan-dev
spec:
  chart:
    spec:
      chart: blobby-server
      version: ${BLOBBY_SERVER_VERSION} # Set in postBuild production
  values:
    env:
      - name: BLOBBY_TOURNAMENT
        value: "1"
      - name: BLOBBY_SITE_URL
        value: https://dev.julalan.no
      - name: BLOBBY_SITE_TOKEN
        secretKeyRef:
          key: BLOBBY_SITE_TOKEN
          name: blobby-server-secrets
    image:
      tag: "dev"
      pullPolicy: Always
    # Players join blobby.dev.julalan.no:1235. The server listens on the same port, and the Service uses it too.
    server:
      port: 1235
    service:
      loadBalancerIP: 192.168.1.198
    persistence:
      storageClass: nfs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blobby-server
  namespace: julalan-prod
spec:
  chart:
    spec:
      chart: blobby-server
      version: ${BLOBBY_SERVER_VERSION} # Set in postBuild production
  values:
    env:
      - name: BLOBBY_TOURNAMENT
        value: "1"
      - name: BLOBBY_SITE_URL
        value: https://julalan.no
      - name: BLOBBY_SITE_TOKEN
        secretKeyRef:
          key: BLOBBY_SITE_TOKEN
          name: blobby-server-secrets
    image:
      tag: "${BLOBBY_SERVER_IMAGE_TAG}" # Set in postBuild production
    # Players join blobby.julalan.no:1234. The server listens on the same port, and the Service uses it too.
    server:
      port: 1234
    service:
      loadBalancerIP: 192.168.1.199
    persistence:
      storageClass: nfs
