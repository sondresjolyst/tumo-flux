apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blobby-volley-tournament
  namespace: julalan-prod
spec:
  values:
    ingress:
      hosts:
        - host: julalan.no
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: blobby-volley-tournament-tls
          hosts:
            - julalan.no
