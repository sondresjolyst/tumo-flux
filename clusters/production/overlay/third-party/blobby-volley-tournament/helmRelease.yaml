# Shared by dev and prod. What differs per namespace is in helmRelease-dev.yaml, helmRelease-dev-env.yaml and helmRelease-prod.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blobby-volley-tournament
spec:
  chart:
    spec:
      chart: blobby-volley-tournament
      version: ${BLOBBY_VOLLEY_TOURNAMENT_VERSION} # Set in postBuild production
  values:
    env:
      - name: DATABASE_URL
        secretKeyRef:
          key: DATABASE_URL
          name: blobby-volley-tournament-secrets
      - name: NEXTAUTH_URL
        secretKeyRef:
          key: NEXTAUTH_URL
          name: blobby-volley-tournament-secrets
      - name: NEXTAUTH_SECRET
        secretKeyRef:
          key: NEXTAUTH_SECRET
          name: blobby-volley-tournament-secrets
      - name: GITHUB_CLIENT_ID
        secretKeyRef:
          key: GITHUB_CLIENT_ID
          name: blobby-volley-tournament-secrets
      - name: GITHUB_CLIENT_SECRET
        secretKeyRef:
          key: GITHUB_CLIENT_SECRET
          name: blobby-volley-tournament-secrets
      - name: ALLOWED_GITHUB_USER_IDS
        secretKeyRef:
          key: ALLOWED_GITHUB_USER_IDS
          name: blobby-volley-tournament-secrets
      - name: TRUSTED_PROXY_IP_HEADER
        value: x-real-ip
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      tls:
        - secretName: blobby-volley-tournament-tls
          hosts:
            # Copied from hosts[0].host in each namespace by replacements.yaml.
            - set-by-replacement
    resources:
      requests:
        memory: "256Mi"
        cpu: "1"
      limits:
        memory: "512Mi"
        cpu: "1"
