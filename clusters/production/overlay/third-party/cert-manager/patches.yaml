apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  path: ./clusters/production/overlay/third-party/cert-manager/chart
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-versions
      - kind: ConfigMap
        name: tumo-flux-config
