apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  releaseName: democratic-csi
  values:
    controller:
      driver:
        enabled: true
        image:
          registry: docker.io/democraticcsi/democratic-csi
          tag: ${DEMOCRATIC_CSI_DRIVER_IMAGE_TAG} # Set in postBuild production
    csiDriver:
      name: "nfs"
    storageClasses:
      - name: nfs
        defaultClass: false
        # Keep the data on the NAS when a PVC is deleted. Remove released volumes by hand.
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
          detachedVolumesFromSnapshots: "false"
        mountOptions:
          - noatime
          - nfsvers=3
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:
    volumeSnapshotClasses: []
    driver:
      existingConfigSecret: api-key-secret
      config:
        driver: freenas-api-nfs
  interval: 15m
  timeout: 5m
