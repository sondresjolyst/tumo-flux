apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garge-api
  namespace: garge-dev
spec:
  values:
    image:
      tag: "dev"
    ingress:
      hosts:
        - host: garge-api-dev.prod.tumogroup.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: garge-api-tls
          hosts:
            - garge-api-dev.prod.tumogroup.com
