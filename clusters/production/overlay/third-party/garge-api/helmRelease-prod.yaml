apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garge-api
  namespace: garge-prod
spec:
  values:
    ingress:
      hosts:
        - host: garge-api.prod.tumogroup.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: garge-api-tls
          hosts:
            - garge-api.prod.tumogroup.com
