# Shared by dev and prod. What differs per namespace is in helmRelease-dev.yaml and helmRelease-prod.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garge-app
spec:
  chart:
    spec:
      chart: garge-app
      version: ${GARGE_APP_VERSION} # Set in postBuild production
  values:
    env:
      - name: NEXTAUTH_SECRET
        secretKeyRef:
          key: NEXTAUTH_SECRET
          name: garge-app-secrets
      - name: NEXTAUTH_URL
        secretKeyRef:
          key: NEXTAUTH_URL
          name: garge-app-secrets
      - name: GARGE_API_JWT_SECRET
        secretKeyRef:
          name: garge-app-secrets
          key: GARGE_API_JWT_SECRET
    image:
      pullPolicy: Always
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      tls:
        - secretName: garge-app-tls
          hosts:
            # Copied from hosts[0].host in each namespace by replacements.yaml.
            - set-by-replacement
    resources:
      requests:
        memory: "2048Mi"
        cpu: "750m"
      limits:
        memory: "2048Mi"
        cpu: "750m"
