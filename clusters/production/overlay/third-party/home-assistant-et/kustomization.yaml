apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ingress.yaml
- configMap.yaml
- namespace.yaml
- helmRelease.yaml
# The host is written once, in rules[0].host, and copied to the TLS hosts.
replacements:
  - source:
      kind: Ingress
      name: home-assistant-et
      namespace: home-assistant-et
      fieldPath: spec.rules.0.host
    targets:
      - select:
          kind: Ingress
          name: home-assistant-et
          namespace: home-assistant-et
        fieldPaths:
          - spec.tls.0.hosts.0
