apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nstuning-api
  namespace: nstuning-prod
spec:
  values:
    ingress:
      hosts:
        - host: nstuning-api.prod.tumogroup.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: nstuning-api-tls
          hosts:
            - nstuning-api.prod.tumogroup.com
