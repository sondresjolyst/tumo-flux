apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nstuning-app
  namespace: nstuning-prod
spec:
  values:
    ingress:
      hosts:
        - host: www.nstuning.no
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: nstuning-app-tls
          hosts:
            - www.nstuning.no
