apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pyttogpanne-app
  namespace: pyttogpanne-dev
spec:
  values:
    image:
      tag: "dev"
    ingress:
      hosts:
        - host: pyttogpanne-dev.prod.tumogroup.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: pyttogpanne-app-tls
          hosts:
            - pyttogpanne-dev.prod.tumogroup.com
