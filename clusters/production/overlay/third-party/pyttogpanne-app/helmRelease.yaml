# Shared by dev and prod. What differs per namespace is in helmRelease-dev.yaml and helmRelease-prod.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pyttogpanne-app
spec:
  chart:
    spec:
      chart: pyttogpanne-app
      version: ${PYTTOGPANNE_APP_VERSION} # Set in postBuild production
  values:
    env:
      - name: NEXTAUTH_SECRET
        secretKeyRef:
          key: NEXTAUTH_SECRET
          name: pyttogpanne-app-secrets
      - name: NEXTAUTH_URL
        secretKeyRef:
          key: NEXTAUTH_URL
          name: pyttogpanne-app-secrets
      - name: PYTTOGPANNE_API_JWT_SECRET
        secretKeyRef:
          key: PYTTOGPANNE_API_JWT_SECRET
          name: pyttogpanne-app-secrets
    image:
      pullPolicy: Always
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      tls:
        - secretName: pyttogpanne-app-tls
          hosts:
            # Copied from hosts[0].host in each namespace by replacements.yaml.
            - set-by-replacement
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "512Mi"
        cpu: "500m"
