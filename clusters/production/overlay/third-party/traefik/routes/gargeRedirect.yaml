apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: garge-redirect
  namespace: garge-prod
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    # The host is copied from the app's prod ingress host by its replacements.yaml.
    replacement: "https://set-by-replacement/$${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: garge-redirect
  namespace: garge-prod
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`garge.no`)
    middlewares:
    - name: garge-redirect
    services:
    - name: noop@internal
      kind: TraefikService
  tls:
    secretName: garge-wildcard-tls-cert
