apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nstuning-api-health
spec:
  # The probes reach the pod directly, so nothing needs to read /health through the ingress.
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nstuning-api-health
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    # The host comes from the app's ingress host, by replacements.yaml in the app's overlay folder.
    match: Host(`set-by-replacement`) && PathPrefix(`/health`)
    # Above the router the chart's Ingress creates for the same host at /.
    priority: 100
    middlewares:
    - name: nstuning-api-health
    services:
    - name: nstuning-api
      port: 80
  tls:
    # The ingress TLS secret, copied by the same replacements.yaml.
    secretName: set-by-replacement
