apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sjolystinnovation-redirect
  namespace: sjolystinnovation-prod
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    replacement: "https://www.sjolystinnovation.no/$${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sjolystinnovation-redirect
  namespace: sjolystinnovation-prod
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`sjolystinnovation.no`)
    middlewares:
    - name: sjolystinnovation-redirect
    services:
    - name: noop@internal
      kind: TraefikService
  tls:
    secretName: sjolystinnovation-wildcard-tls-cert
