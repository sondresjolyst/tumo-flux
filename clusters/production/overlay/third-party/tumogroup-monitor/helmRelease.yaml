apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tumogroup-monitor
  namespace: tumogroup-monitor-prod
spec:
  chart:
    spec:
      chart: tumogroup-monitor
      version: ${TUMOGROUP_MONITOR_VERSION} # Set in postBuild production
  values:
    env:
      - name: DATABASE_URL
        secretKeyRef:
          key: DATABASE_URL
          name: tumogroup-monitor-page
      - name: GITHUB_CLIENT_ID
        secretKeyRef:
          key: GITHUB_CLIENT_ID
          name: tumogroup-monitor-page
      - name: GITHUB_CLIENT_SECRET
        secretKeyRef:
          key: GITHUB_CLIENT_SECRET
          name: tumogroup-monitor-page
      - name: NEXTAUTH_SECRET
        secretKeyRef:
          key: NEXTAUTH_SECRET
          name: tumogroup-monitor-page
      - name: NEXTAUTH_URL
        secretKeyRef:
          key: NEXTAUTH_URL
          name: tumogroup-monitor-page
      - name: ALLOWED_GITHUB_USER_ID
        secretKeyRef:
          key: ALLOWED_GITHUB_USER_ID
          name: tumogroup-monitor-page
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: monitor.prod.tumogroup.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: tumogroup-monitor-tls
          hosts:
            - monitor.prod.tumogroup.com
    cronjob:
      env:
        - name: DATABASE_URL
          secretKeyRef:
            key: DATABASE_URL
            name: tumogroup-monitor-job
        - name: GITHUB_APP_ID
          secretKeyRef:
            key: GITHUB_APP_ID
            name: tumogroup-monitor-job
        - name: GITHUB_PRIVATE_KEY
          secretKeyRef:
            key: GITHUB_PRIVATE_KEY
            name: tumogroup-monitor-job
