apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  prune: false
  postBuild:
    substitute:
      FLUX_CONFIG_PATH: ./clusters/production
      TUMO_ZONE: prod # dev | playground | prod
      TUMO_ENVIRONMENT: prod # prod
      BOBBY_API_VERSION: 1.0.1 # https://artifacthub.io/packages/helm/tumogroup/bobby-api
      CERT_MANAGER_VERSION: 1.21.2 # https://artifacthub.io/packages/helm/cert-manager/cert-manager
      DEMOCRATIC_CSI_VERSION: 0.15.1 # https://artifacthub.io/packages/helm/democratic-csi/democratic-csi
      DEMOCRATIC_CSI_DRIVER_IMAGE_TAG: v1.9.5 # https://github.com/democratic-csi/democratic-csi/releases
      DESCHEDULER_VERSION: 0.37.0 # https://artifacthub.io/packages/helm/descheduler/descheduler
      EMQX_VERSION: 5.8.9 # https://artifacthub.io/packages/helm/emqx-operator/emqx
      GARGE_API_VERSION: 0.1.66 # https://artifacthub.io/packages/helm/garge/garge-api
      GARGE_APP_VERSION: 0.1.54 # https://artifacthub.io/packages/helm/garge/garge-app
      GARGE_OPERATOR_VERSION: 0.1.41 # https://artifacthub.io/packages/helm/garge/garge-operator
      NSTUNING_API_VERSION: 0.1.26 # https://artifacthub.io/packages/helm/tumogroup/nstuning-api
      NSTUNING_APP_VERSION: 0.1.23 # https://artifacthub.io/packages/helm/tumogroup/nstuning-app
      ALTINNENDATA_API_VERSION: 0.1.20 # https://artifacthub.io/packages/helm/tumogroup/altinnendata-api
      ALTINNENDATA_APP_VERSION: 0.1.23 # https://artifacthub.io/packages/helm/tumogroup/altinnendata-app
      PYTTOGPANNE_API_VERSION: 0.1.6 # https://artifacthub.io/packages/helm/tumogroup/pyttogpanne-api
      PYTTOGPANNE_APP_VERSION: 0.1.5 # https://artifacthub.io/packages/helm/tumogroup/pyttogpanne-app
      SJOLYSTINNOVATION_APP_VERSION: 0.1.5 # https://artifacthub.io/packages/helm/tumogroup/sjolystinnovation-app
      GRAFANA_VERSION: 13.2.7 # https://artifacthub.io/packages/helm/grafana-community/grafana
      HOME_ASSISTANT_VERSION_ET: 2.11.4 # https://artifacthub.io/packages/helm/alekc/home-assistant
      HOME_ASSISTANT_VERSION: 2.11.4 # https://artifacthub.io/packages/helm/alekc/home-assistant
      REFLECTOR_VERSION: 10.0.65 # https://artifacthub.io/packages/helm/emberstack/reflector
      KURED_VERSION: 6.1.0 # https://artifacthub.io/packages/helm/kured/kured
      LIBRETRANSLATE_VERSION: v1.9.6 # https://github.com/LibreTranslate/LibreTranslate/releases
      METALLB_VERSION: 0.16.1 # https://artifacthub.io/packages/helm/metallb/metallb
      METRICS_VERSION: 3.14.0 # https://artifacthub.io/packages/helm/metrics-server/metrics-server
      MINECRAFT_VERSION: 5.2.0 # https://artifacthub.io/packages/helm/minecraft-server-charts/minecraft
      LOKI_VERSION: 18.13.7 # https://artifacthub.io/packages/helm/grafana-community/loki
      PROMETHEUS_VERSION: 91.9.0 # https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
      ALLOY_VERSION: 1.13.0 # https://artifacthub.io/packages/helm/grafana/alloy
      TRAEFIK_VERSION: 41.6.1 # https://artifacthub.io/packages/helm/traefik/traefik
    substituteFrom:
      - kind: ConfigMap
        name: tumo-flux-config
