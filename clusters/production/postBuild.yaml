apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  prune: false
  postBuild:
    substitute:
      FLUX_CONFIG_PATH: ./clusters/production
      TUMO_ZONE: prod # dev | playground | prod
      TUMO_ENVIRONMENT: prod # prod
      BOBBY_API_VERSION: 1.0.1 # https://artifacthub.io/packages/helm/tumogroup/bobby-api
      CERT_MANAGER_VERSION: 1.21.3 # https://artifacthub.io/packages/helm/cert-manager/cert-manager
      DEMOCRATIC_CSI_VERSION: 0.15.1 # https://artifacthub.io/packages/helm/democratic-csi/democratic-csi
      DEMOCRATIC_CSI_DRIVER_IMAGE_TAG: v1.9.5 # https://github.com/democratic-csi/democratic-csi/releases
      DESCHEDULER_VERSION: 0.37.0 # https://artifacthub.io/packages/helm/descheduler/descheduler
      EMQX_VERSION: 5.8.9 # https://artifacthub.io/packages/helm/emqx-operator/emqx
      GARGE_API_VERSION: 0.1.78 # https://artifacthub.io/packages/helm/garge/garge-api
      GARGE_APP_VERSION: 0.1.67 # https://artifacthub.io/packages/helm/garge/garge-app
      GARGE_OPERATOR_VERSION: 0.1.44 # https://artifacthub.io/packages/helm/garge/garge-operator
      NSTUNING_API_VERSION: 0.1.33 # https://artifacthub.io/packages/helm/tumogroup/nstuning-api
      NSTUNING_APP_VERSION: 0.1.34 # https://artifacthub.io/packages/helm/tumogroup/nstuning-app
      ALTINNENDATA_API_VERSION: 0.1.35 # https://artifacthub.io/packages/helm/tumogroup/altinnendata-api
      ALTINNENDATA_APP_VERSION: 0.1.36 # https://artifacthub.io/packages/helm/tumogroup/altinnendata-app
      PYTTOGPANNE_API_VERSION: 0.1.14 # https://artifacthub.io/packages/helm/tumogroup/pyttogpanne-api
      PYTTOGPANNE_APP_VERSION: 0.1.12 # https://artifacthub.io/packages/helm/tumogroup/pyttogpanne-app
      SJOLYSTINNOVATION_APP_VERSION: 0.1.14 # https://artifacthub.io/packages/helm/tumogroup/sjolystinnovation-app
      TUMOGROUP_MONITOR_VERSION: 0.1.2 # https://artifacthub.io/packages/helm/tumogroup/tumogroup-monitor
      BLOBBY_VOLLEY_TOURNAMENT_VERSION: 0.1.7 # https://artifacthub.io/packages/helm/tumogroup/blobby-volley-tournament
      BLOBBY_SERVER_VERSION: 0.2.0 # https://artifacthub.io/packages/helm/tumogroup/blobby-server
      BLOBBY_SERVER_IMAGE_TAG: unreleased # Game release image for prod, such as 0.1.0@sha256:<digest>. Unsuspend prod blobby-server after.
      GRAFANA_VERSION: 14.4.1 # https://artifacthub.io/packages/helm/grafana-community/grafana
      HOME_ASSISTANT_VERSION_ET: 2.14.1 # https://artifacthub.io/packages/helm/alekc/home-assistant
      HOME_ASSISTANT_VERSION: 2.14.1 # https://artifacthub.io/packages/helm/alekc/home-assistant
      REFLECTOR_VERSION: 10.0.77 # https://artifacthub.io/packages/helm/emberstack/reflector
      KURED_VERSION: 6.1.0 # https://artifacthub.io/packages/helm/kured/kured
      LIBRETRANSLATE_VERSION: v1.9.6 # https://github.com/LibreTranslate/LibreTranslate/releases
      METALLB_VERSION: 0.16.2 # https://artifacthub.io/packages/helm/metallb/metallb
      METRICS_VERSION: 3.14.0 # https://artifacthub.io/packages/helm/metrics-server/metrics-server
      MINECRAFT_VERSION: 5.3.1 # https://artifacthub.io/packages/helm/minecraft-server-charts/minecraft
      LOKI_VERSION: 21.2.2 # https://artifacthub.io/packages/helm/grafana-community/loki
      PROMETHEUS_VERSION: 93.2.2 # https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
      ALLOY_VERSION: 1.15.0 # https://artifacthub.io/packages/helm/grafana/alloy
      TRAEFIK_VERSION: 42.4.0 # https://artifacthub.io/packages/helm/traefik/traefik
      CROWDSEC_VERSION: 0.24.3 # https://artifacthub.io/packages/helm/crowdsec/crowdsec
      CROWDSEC_BOUNCER_PLUGIN_VERSION: v1.8.1 # https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/releases
    substituteFrom:
      - kind: ConfigMap
        name: tumo-flux-config
