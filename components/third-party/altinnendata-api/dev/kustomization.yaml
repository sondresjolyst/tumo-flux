apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: altinnendata-dev
resources:
- ../base
patches:
  # Dev reaches Postgres on port 5433.
  - target:
      kind: NetworkPolicy
      name: altinnendata-api-egress
    patch: |-
      - op: test
        path: /spec/egress/1/ports/0/port
        value: 5432
      - op: replace
        path: /spec/egress/1/ports/0/port
        value: 5433
