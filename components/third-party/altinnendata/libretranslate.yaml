apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: libretranslate-models
  namespace: altinnendata-dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libretranslate
  namespace: altinnendata-dev
  labels:
    app: libretranslate
spec:
  replicas: 1
  # The models volume is ReadWriteOnce, so the old pod has to let go before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: libretranslate
  template:
    metadata:
      labels:
        app: libretranslate
    spec:
      containers:
        - name: libretranslate
          image: libretranslate/libretranslate:${LIBRETRANSLATE_VERSION}
          env:
            - name: LT_LOAD_ONLY
              value: en,nb
            - name: LT_DISABLE_WEB_UI
              value: "true"
            - name: LT_UPDATE_MODELS
              value: "false"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /home/libretranslate/.local/share
          readinessProbe:
            httpGet:
              path: /languages
              port: http
            # The image ships no models, so an empty volume is filled before it answers.
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "500m"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: libretranslate-models
---
apiVersion: v1
kind: Service
metadata:
  name: libretranslate
  namespace: altinnendata-dev
  labels:
    app: libretranslate
spec:
  type: ClusterIP
  selector:
    app: libretranslate
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
---
