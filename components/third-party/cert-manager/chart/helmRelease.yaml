apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  values:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
    installCRDs: true
    global:
      rbac:
        create: true
    podLabels: { aadpodidbinding: certman-label }
  valuesFrom:
    - kind: Secret
      name: cert-manager-helm-secret
      valuesKey: config
