apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  releaseName: democratic-csi
  chartRef:
    kind: OCIRepository
    name: democratic-csi
    namespace: flux-system
  values:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
  interval: 15m
  timeout: 5m
  install:
    remediation:
      retries: 3
