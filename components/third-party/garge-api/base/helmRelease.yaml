apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garge-api
spec:
  releaseName: garge-api
  chart:
    spec:
      chart: garge-api
      version: xx # Set by flux patch
      sourceRef:
        kind: HelmRepository
        name: garge
        namespace: flux-system
  interval: 5m
  install:
    remediation:
      retries: 3
