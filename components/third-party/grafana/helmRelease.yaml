apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitor
spec:
  releaseName: grafana
  chart:
    spec:
      chart: grafana
      version: xx # Set by flux patch
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    cleanupOnFail: true
  values:
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
    nodeSelector: {"kubernetes.io/os": "linux"}
    env:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_SSL_MODE: "require"
      # GF_SERVER_ROOT_URL: ""                    # Set by secret
      # GF_DATABASE_PASSWORD: ""                  # Set by secret
      # GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ""       # Set by secret
      # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ""   # Set by secret
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Bounded so two pods during a rolling update stay under the role connection limit.
      GF_DATABASE_MAX_OPEN_CONN: "10"
      GF_DATABASE_MAX_IDLE_CONN: "2"
    envFromSecret: grafana-secrets
  valuesFrom:
  - kind: Secret
    name: grafana-helm-secret
    valuesKey: config