apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    meta.helm.sh/release-namespace: kube-system
  name: kured
  namespace: kube-system
spec:
  releaseName: kured
  chartRef:
    kind: OCIRepository
    name: kured
    namespace: flux-system
  interval: 5m
  install:
    remediation:
      retries: 3
  values:
    updateStrategy: RollingUpdate
    resources:
      requests:
        cpu: "10m"
        memory: "128Mi"
    # metrics:
    #   create: true
    extraArgs:
      period: 5m0s
      reboot-days: mon,tue,wed,thu,fri
      time-zone: CET
