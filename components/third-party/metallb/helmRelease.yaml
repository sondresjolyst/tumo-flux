apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  releaseName: metallb
  chartRef:
    kind: OCIRepository
    name: metallb
    namespace: flux-system
  interval: 15m
  timeout: 5m
  install:
    remediation:
      retries: 3
  # valuesFrom:
  # - kind: ConfigMap
  #   name: metallb-config
  #   valuesKey: values.yaml # This is the default, but best to be explicit for clarity