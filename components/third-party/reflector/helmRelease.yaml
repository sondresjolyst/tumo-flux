apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-system
spec:
  releaseName: reflector
  chartRef:
    kind: OCIRepository
    name: reflector
    namespace: flux-system
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    cleanupOnFail: true
  values:
    image:
      repository: ghcr.io/emberstack/kubernetes-reflector
