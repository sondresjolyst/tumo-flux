apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      version: xx # Set by flux patch
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 1m0s
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      podLabels:
        app: traefik
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - traefik
            topologyKey: kubernetes.io/hostname
    ingressClass:
      enabled: true
      isDefaultClass: true
    ingressRoute:
      dashboard:
        enabled: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    additionalArguments:
    # Not the chart's ports.web.http.redirections: it validates `to` against its
    # own entryPoint list and resolves websecure to its exposed port, 444.
    # Clients reach HAProxy on 443, and Traefik accepts a bare port here.
    - --entryPoints.web.http.redirections.entryPoint.to=:443
    - --entryPoints.web.http.redirections.entryPoint.scheme=https
    - --entryPoints.web.http.redirections.entryPoint.permanent=true
    service:
      spec:
        externalTrafficPolicy: Local
    tlsStore:
      default:
        # The secret is mirrored into this namespace by reflector, see
        # cert-manager certificate.yaml.
        defaultCertificate:
          secretName: tumo-wildcard-tls-cert
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    # Alloy ships stdout to Loki, so json here is queryable with `| json`.
    accessLog:
      enabled: true
      format: json
      fields:
        names:
          # ClientHost is the caller's address; the rest of the client fields carry nothing
          # the dashboards use.
          ClientAddr: drop
          ClientPort: drop
          ClientUsername: drop
        headers:
          names:
            User-Agent: keep
            Referer: keep
            # Next.js marks a speculative prefetch with this. Without it a prefetch and a real
            # navigation are the same request, and page views cannot be counted.
            Next-Router-Prefetch: keep
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
