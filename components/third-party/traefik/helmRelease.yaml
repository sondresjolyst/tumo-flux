apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      version: xx # Set by flux patch
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 1m0s
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      podLabels:
        app: traefik
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - traefik
            topologyKey: kubernetes.io/hostname
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              # Not websecure: the chart resolves that to its exposed port, 444.
              # Clients reach HAProxy on 443.
              to: ":443"
              scheme: https
              permanent: true
    service:
      spec:
        externalTrafficPolicy: Local
    tlsStore:
      default:
        # The secret is mirrored into this namespace by reflector, see
        # cert-manager certificate.yaml.
        defaultCertificate:
          secretName: tumo-wildcard-tls-cert
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 512Mi
